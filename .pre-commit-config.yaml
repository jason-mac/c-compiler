repos:
  - repo: local
    hooks:
      - id: cmake-format
        name: cmake-format
        entry: cmake-format -i
        language: system
        files: (CMakeLists\.txt|\.cmake)$
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        files: \.(c|h|cpp|hpp|cc|cxx)$
